<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self'; 
    connect-src 'self' https://nomnom-api.nicoleechia.workers.dev https://gmxbebwnmundpuvswcku.supabase.co; 
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; 
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
    font-src 'self' https://fonts.gstatic.com;
  ">
  <title>NomNom Planner</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght=400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #FDFCF8;
      --card: #FFFFFF;
      --accent: #4A674A;
      --accent-light: #F0F4F0;
      --text: #2C2C2C;
      --text-light: #707070;
      --border: #E2DDD2;
      --sans: 'Quicksand', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5; padding-top: 60px; }

    .top-nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: 60px; display: flex; justify-content: flex-end; align-items: center;
      padding: 0 16px; background: rgba(253, 252, 248, 0.8);
      backdrop-filter: blur(10px); z-index: 800;
    }

    .history-btn {
      background: var(--accent-light); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 12px; cursor: pointer;
      font-family: var(--sans); font-weight: 600; color: var(--accent); font-size: 0.85rem;
    }

    .wrap { padding: 0 16px 140px; max-width: 600px; margin: 0 auto; }

    .card {
      background: var(--card); border-radius: 20px; padding: 20px;
      margin-bottom: 16px; border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .meal-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--accent-light);
    }
    .meal-row:last-child { border-bottom: none; }
    
    .stepper { display: flex; align-items: center; background: var(--accent-light); border-radius: 10px; padding: 4px; }
    .step-btn { width: 32px; height: 32px; border: none; background: #fff; border-radius: 6px; font-weight: bold; cursor: pointer; color: var(--accent); }
    .step-val { width: 34px; text-align: center; font-weight: 600; }

    .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-light); margin-bottom: 12px; font-weight: 600; }
    .chip-flex { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 7px 14px; border-radius: 12px; background: #fff;
      border: 1px solid var(--border); font-size: 0.85rem; cursor: pointer;
    }
    .chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

    textarea { 
      width: 100%; border: 1px solid var(--border); border-radius: 12px; 
      padding: 12px; font-family: inherit; font-size: 0.9rem; 
      background: var(--accent-light); outline: none; resize: vertical;
      min-height: 80px;
    }

    .bottom-bar {
      position: fixed; bottom: 20px; left: 16px; right: 16px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      z-index: 900;
    }
    .go-btn { background: var(--accent); color: #fff; border: none; padding: 14px 28px; border-radius: 14px; font-weight: 600; cursor: pointer; font-family: var(--sans); }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; padding: 20px; align-items: flex-end; }
    .modal { background: #fff; border-radius: 24px; width: 100%; max-height: 85vh; padding: 24px; overflow-y: auto; }

    .recipe-card {
      background: var(--accent-light); border-radius: 16px; padding: 16px;
      margin-bottom: 16px; position: relative; border: 1px solid var(--border);
      text-align: left;
    }
    .save-btn {
      position: absolute; top: 16px; right: 16px;
      background: #fff; border: 1px solid var(--accent); color: var(--accent);
      padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.7rem;
      z-index: 10;
    }
    .save-btn.saved { background: var(--accent); color: #fff; border-color: transparent; }

    .loader { display: none; position: fixed; inset: 0; z-index: 2000; background: var(--bg); align-items: center; justify-content: center; font-weight: 600; color: var(--accent); }

    details summary::-webkit-details-marker { display: inline-block; }
    details[open] summary { margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="top-nav">
  <button class="history-btn" onclick="viewHistory()">📜 History</button>
</div>

<div class="wrap">
  <div class="card">
    <div class="section-title">Meal Volume</div>
    <div class="meal-row"><div><strong>Breakfast</strong></div><div class="stepper"><button class="step-btn" onclick="adj('breakfast',-1)">-</button><span class="step-val" id="v-breakfast">0</span><button class="step-btn" onclick="adj('breakfast',1)">+</button></div></div>
    <div class="meal-row"><div><strong>Main Meals</strong></div><div class="stepper"><button class="step-btn" onclick="adj('mains',-1)">-</button><span class="step-val" id="v-mains">0</span><button class="step-btn" onclick="adj('mains',1)">+</button></div></div>
    <div class="meal-row"><div><strong>Dessert</strong></div><div class="stepper"><button class="step-btn" onclick="adj('dessert',-1)">-</button><span class="step-val" id="v-dessert">0</span><button class="step-btn" onclick="adj('dessert',1)">+</button></div></div>
  </div>

  <div id="pantry-mount"></div>

  <div class="card">
    <div class="section-title">Special Instructions</div> 
    <textarea id="notes" rows="2" placeholder="Exclusions, prep style, or flavor preferences..."></textarea>
  </div>
</div>

<div class="bottom-bar">
  <div><small>Total Plan</small><br><strong id="tot">0</strong> Meals</div>
  <button class="go-btn" onclick="generate()">Generate Plan</button>
</div>

<div class="loader" id="loader">Architecting meals...</div>

<div class="overlay" id="overlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div id="recipe-container"></div>
    <button onclick="closeModal()" style="margin-top:20px; width:100%; padding:15px; border-radius:12px; border:none; background:var(--accent-light); color:var(--accent); font-weight:600; cursor:pointer;">Close</button>
  </div>
</div>

<script>
  const S_URL = 'https://gmxbebwnmundpuvswcku.supabase.co';
  const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdteGJlYndubXVuZHB1dnN3Y2t1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxODM0OTQsImV4cCI6MjA5MDc1OTQ5NH0.d8JTYA23pscN0Pt7MW4-_9LQ4XnsPv8TF9aoHoXVF3s';
  const client = supabase.createClient(S_URL, S_KEY);

  let counts = { breakfast: 0, mains: 0, dessert: 0 };
  let masterPantry = [];

  function adj(t, d) {
    counts[t] = Math.max(0, counts[t] + d);
    document.getElementById(`v-${t}`).innerText = counts[t];
    document.getElementById('tot').innerText = Object.values(counts).reduce((a, b) => a + b, 0);
  }

  async function init() {
    const { data } = await client.from('inventory').select('*');
    if (data) {
      masterPantry = data.map(i => ({ name: i.item_name, qty: i.quantity || 'unspecified' }));
      const mount = document.getElementById('pantry-mount');
      mount.innerHTML = '';
      const cats = [...new Set(data.map(i => i.ingredient_category))];
      cats.forEach(cat => {
        const wrap = document.createElement('div');
        wrap.className = 'card';
        wrap.innerHTML = `<div class="section-title">${cat || 'Pantry'}</div><div class="chip-flex"></div>`;
        const chips = wrap.querySelector('.chip-flex');
        data.filter(i => i.ingredient_category === cat).forEach(item => {
          const c = document.createElement('div');
          c.className = 'chip'; 
          c.innerText = `${item.item_name} (${item.quantity || '?'})`;
          c.onclick = () => c.classList.toggle('selected');
          chips.appendChild(c);
        });
        mount.appendChild(wrap);
      });
    }
  }

  async function generate() {
    const sel = Array.from(document.querySelectorAll('.chip.selected')).map(c => c.innerText.split(' (')[0]);
    const totalMeals = Object.values(counts).reduce((a, b) => a + b, 0);
    
    if (totalMeals === 0) return alert("Select meal counts.");
    
    document.getElementById('loader').style.display = 'flex';
    const pantryContext = masterPantry.map(p => `${p.name}: ${p.qty}`).join(', ');

    const prompt = `System: Creative Culinary Architect & Macro Specialist.

CORE MISSION:
- Create high-quality, diverse, professional recipes within strict nutritional parameters.
- PRIMARY FOCUS: You MUST incorporate the "Selected Ingredients" below. You do not need to use the entire quantity provided.
- CREATIVE FREEDOM: Suggest additional ingredients (staples, aromatics, spices, specialty items) to ensure dishes are cohesive, vibrant, and authentic.
- MANDATORY CUISINE DIVERSITY: Avoid generic stir-fries, plain baked proteins, or basic pasta dishes. Unless user notes specify otherwise, actively rotate through distinct regional sub-cuisines (e.g., Sichuan, Cantonese, Hunan, Isan, Peranakan, Javanese, Balinese, Korean, Okinawan, Chettinad, Kerala, Goan, Bengali, Sri Lankan, Levantine, Maghrebi, Persian, Anatolian, Yemeni, Georgian, Sicilian, Tuscan, Neapolitan, Basque, Catalan, Andalusian, Provencal, Oaxacan, Yucatecan, Peruvian, Bahian, Jamaican, Trinidadian, Cajun, Creole, West African, Ethiopian, Swahili Coast, or Cape Malay.).

QUANTITY MANDATE:
- YOU MUST GENERATE EXACTLY ${totalMeals} SEPARATE RECIPES IN TOTAL.
- Target Breakdown: ${counts.breakfast} Breakfast recipe(s), ${counts.mains} Main Savory Meal recipe(s), ${counts.dessert} Dessert recipe(s).
- EACH RECIPE MUST BE INDIVIDUALLY WRAPPED IN ITS OWN STANDALONE PAIR OF [RECIPE] TAGS. Do NOT combine multiple recipes into one block.
- MULTI-SERVING POLICY: If a single recipe yields portions that can cover multiple meal slots, explicitly state it at the top (e.g., **Serves:** 2 — *Can be used for 2 Main Meals*).
- Do not stop until all ${totalMeals} recipes have been fully generated.

MACRO GUIDELINES (Flexible):
Estimate calories, protein, carbs, and fats based on standard USDA nutritional values for given weights.
Calculate all rice/pasta/grain weights assuming DRY mass.
- Target Protein: ~40g (Primary focus)
- Target Fat: 10-15g
- Target Carbs: 30-40g (up to 70g acceptable)

SPICE AND PANTRY LOGIC: 
- 1 bottle/jar dry spice = standard 1 tsp (~5g) usage in calculations (macro-negligible).

STRICT INVENTORY LOGIC:
- SUPPLEMENT FIREWALL: Use protein powders and sweet syrups ONLY for Breakfast or Dessert. 
- use oat bran or oats ONLY for breakfast or Dessert, not for main meals.
- SAVORY BASE: Main Meals must be built around whole-food protein from Selected Ingredients.

INPUT DATA:
- TOTAL RECIPES REQUIRED TO GENERATE: ${totalMeals}
- Meal Breakdown: ${counts.breakfast} Breakfast, ${counts.mains} Main Savory Meals, ${counts.dessert} Dessert.
- Selected Ingredients (Required): [${sel.join(', ')}]
- Remaining Inventory (Available if needed): [${pantryContext}]
- Additional Notes: ${document.getElementById('notes').value}

EXECUTION WORKFLOW FOR EVERY SINGLE RECIPE:
For EVERY recipe (repeat sequence ${totalMeals} times):

STEP 1: THOUGHT PROCESS (Inside <thinking>...</thinking> tags)
Keep thinking CONCISE (max 4-5 bullet points total).
1. Cuisine & Technique.
2. Ingredient Weights: Define the EXACT raw/dry weights. You MUST use these exact weights in the recipe instructions below.
3. Macro Math: Write out the addition equation to prove your math (e.g., Protein: 25g + 10g = 35g). Use strict USDA raw/dry values.
YOU MUST CLOSE WITH </thinking> BEFORE STARTING [RECIPE].

STEP 2: OUTPUT STRUCTURAL MANDATE
AFTER the </thinking> tag, output the recipe strictly inside [RECIPE]...[/RECIPE].
The ingredient amounts in the recipe MUST perfectly match the amounts decided in the thinking block.

EXAMPLE OUTPUT FORMAT:

<thinking>
- Cuisine Target: Levantine (Garlic-lemon sumac chicken)
- Weights: 115g chicken breast, 150g dry pasta, 8g olive oil
- Protein Math: 35g (chicken) + 5g (pasta) = 40g
- Carbs Math: 0g (chicken) + 106g (pasta) = 106g
- Fat Math: 1.5g (chicken) + 8g (oil) = 9.5g
</thinking>
[RECIPE]
## Recipe Title
**Serves:** 1  
**Prep Time:** 10 minutes  
**Cook Time:** 15 minutes

**Ingredients:**
- 115g chicken breast, diced
- 150g dry pasta
- 8g olive oil
...
**Instructions:**
...
**Nutrition (Approximate):** 40g protein, 106g carbs, 10g fat
[/RECIPE]`;

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 45000);

      const res = await fetch('https://nomnom-api.nicoleechia.workers.dev', {
        method: 'POST', 
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ messages: [{ role: 'user', content: prompt }] }),
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (!res.ok) {
        const errBody = await res.text();
        throw new Error(`Worker HTTP ${res.status}: ${errBody}`);
      }

      const d = await res.json();
      console.log("=== WORKER RESPONSE ===", d);

      const text = d.content?.[0]?.text || d.choices?.[0]?.message?.content || d.reply || d.message || (typeof d === 'string' ? d : null);

      if (!text) {
        throw new Error("Worker returned an empty or unparseable JSON payload: " + JSON.stringify(d));
      }

      renderRecipes(text);
      document.getElementById('overlay').style.display = 'flex';

    } catch(e) { 
      console.error("GENERATE ERROR:", e); 
      const container = document.getElementById('recipe-container');
      container.innerHTML = `
        <div class="recipe-card" style="border-color: #d9534f; background: #fdf7f7;">
          <h3 style="color: #d9534f; margin-bottom: 8px;">Generation Error</h3>
          <p style="font-size:0.85rem; color: #333; word-break: break-word;">${e.message || e}</p>
        </div>`;
      document.getElementById('overlay').style.display = 'flex';
    } finally {
      document.getElementById('loader').style.display = 'none';
    }
  }

  function renderRecipes(text) {
    const container = document.getElementById('recipe-container');
    container.innerHTML = '';
    
    // Pattern to match pairs of <thinking>...</thinking> and [RECIPE]...[/RECIPE]
    const pairRegex = /(?:<thinking>([\s\S]*?)<\/thinking>[\s\r\n]*)?\[RECIPE\]([\s\S]*?)\[\/RECIPE\]/gi;
    let match;
    let index = 0;
    let foundMatches = false;

    while ((match = pairRegex.exec(text)) !== null) {
      foundMatches = true;
      const thinkingText = match[1] ? match[1].trim() : null;
      const recipeText = match[2].trim();

      createRecipeCard(container, recipeText, thinkingText, index);
      index++;
    }

    // Fallback: If [RECIPE] tags were omitted, fall back to header splitting
    if (!foundMatches) {
      let cleanedText = text.replace(/<thinking>[\s\S]*?<\/thinking>/gi, '').trim();
      let rawBlocks = [];

      if (cleanedText.includes('##')) {
        rawBlocks = cleanedText.split(/(?=##\s)/g).map(r => r.trim()).filter(r => r.length > 20);
      }

      if (rawBlocks.length > 0) {
        rawBlocks.forEach((recipeText, i) => {
          createRecipeCard(container, recipeText, null, i);
        });
      } else {
        const div = document.createElement('div');
        div.className = 'recipe-card';
        div.innerHTML = `<div style="white-space: pre-wrap; font-size: 0.9rem;">${cleanedText}</div>`;
        container.appendChild(div);
      }
    }
  }

  function createRecipeCard(container, recipeText, thinkingText, index) {
    const lines = recipeText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    const titleLine = lines.find(l => l.startsWith('##')) || lines[0] || 'Recipe';
    const mealName = titleLine.replace(/^##\s*/, '').trim();
    
    const div = document.createElement('div');
    div.className = 'recipe-card';
    const uniqueId = `save-${index}`;
    
    const saveBtn = document.createElement('button');
    saveBtn.className = 'save-btn';
    saveBtn.id = uniqueId;
    saveBtn.setAttribute('data-db-id', '');
    saveBtn.innerText = 'Save';
    
    saveBtn.dataset.recipeContent = recipeText;
    saveBtn.dataset.mealName = mealName;
    
    saveBtn.onclick = function() {
      handleSaveToggle(uniqueId, this.dataset.recipeContent, this.dataset.mealName);
    };

    div.appendChild(saveBtn);
    
    // Add Expandable Thinking Block if available
    if (thinkingText) {
      const details = document.createElement('details');
      details.style.cssText = "margin-bottom: 12px; background: #fff; padding: 10px; border-radius: 10px; border: 1px solid var(--border);";
      
      const summary = document.createElement('summary');
      summary.style.cssText = "cursor: pointer; font-weight: 600; font-size: 0.8rem; color: var(--accent); user-select: none;";
      summary.innerText = "🔍 View Macro & Culinary Calculation";
      
      const thinkingPre = document.createElement('pre');
      thinkingPre.style.cssText = "white-space: pre-wrap; font-size: 0.8rem; margin-top: 8px; color: #444; font-family: inherit;";
      thinkingPre.innerText = thinkingText;

      details.appendChild(summary);
      details.appendChild(thinkingPre);
      div.appendChild(details);
    }
    
    const contentDiv = document.createElement('div');
    contentDiv.style.cssText = "white-space: pre-wrap; font-size: 0.9rem;";
    contentDiv.innerText = recipeText.trim();
    
    div.appendChild(contentDiv);
    container.appendChild(div);
  }

  async function handleSaveToggle(uniqueId, content, name) {
    const btn = document.getElementById(uniqueId);
    const id = btn.getAttribute('data-db-id');

    if (!id) {
      try {
        const { data, error } = await client
          .from('history')
          .insert([{ plan_text: content, meal_summary: name || 'Untitled Meal' }])
          .select();

        if (error) {
          alert(`Failed to save: ${error.message || JSON.stringify(error)}`);
          return;
        }

        if (data && Array.isArray(data) && data.length > 0) {
          btn.innerText = "Unsave"; 
          btn.classList.add('saved'); 
          btn.setAttribute('data-db-id', data[0].id);
        } else {
          btn.innerText = "Saved";
          btn.classList.add('saved');
        }
      } catch (jsError) {
        alert(`Application Error: ${jsError.message}`);
      }
    } else {
      try {
        const { error } = await client.from('history').delete().eq('id', id);
        if (error) {
          alert(`Failed to unsave: ${error.message}`);
          return;
        }
        
        btn.innerText = "Save"; 
        btn.classList.remove('saved'); 
        btn.setAttribute('data-db-id', ''); 
        if (uniqueId.startsWith('hist-')) {
          btn.parentElement.style.opacity = '0.4';
          btn.parentElement.style.pointerEvents = 'none';
        }
      } catch (jsError) {
        console.error("Client-side crash during delete:", jsError);
      }
    }
  }

  async function viewHistory() {
    document.getElementById('loader').style.display = 'flex';
    const { data, error } = await client.from('history').select('*').order('created_at', { ascending: false });
    if (!error) {
      const container = document.getElementById('recipe-container');
      container.innerHTML = '<div class="section-title">Saved History</div>';
      
      data.forEach((row) => {
        const div = document.createElement('div');
        div.className = 'recipe-card';
        const uniqueId = `hist-save-${row.id}`;
        
        const unsaveBtn = document.createElement('button');
        unsaveBtn.className = 'save-btn saved';
        unsaveBtn.id = uniqueId;
        unsaveBtn.setAttribute('data-db-id', row.id);
        unsaveBtn.innerText = 'Unsave';
        
        unsaveBtn.dataset.recipeContent = row.plan_text;
        unsaveBtn.dataset.mealName = row.meal_summary;
        
        unsaveBtn.onclick = function() {
          handleSaveToggle(uniqueId, this.dataset.recipeContent, this.dataset.mealName);
        };
        
        const metaDiv = document.createElement('small');
        metaDiv.innerText = new Date(row.created_at).toLocaleDateString();
        
        const contentDiv = document.createElement('div');
        contentDiv.style.cssText = "white-space: pre-wrap; font-size: 0.9rem; margin-top:10px;";
        contentDiv.innerText = row.plan_text;
        
        div.appendChild(unsaveBtn);
        div.appendChild(metaDiv);
        div.appendChild(contentDiv);
        container.appendChild(div);
      });
      document.getElementById('overlay').style.display = 'flex';
    }
    document.getElementById('loader').style.display = 'none';
  }

  function closeModal() { document.getElementById('overlay').style.display = 'none'; }
  init();
</script>
</body>
</html>
